<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="grad_overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.8)" />
      <stop offset="25%" stop-color="rgba(0,0,0,0.2)" />
      <stop offset="70%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.9)" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <image href="https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=800&amp;q=80" width="800" height="800" preserveAspectRatio="xMidYMid slice" />
  <rect width="800" height="800" fill="url(#grad_overlay)" />
  
  <text x="50%" y="15%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="4" filter="url(#shadow)">FRIENDSHIP DAY</text>
  <text x="50%" y="22%" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" letter-spacing="6" filter="url(#shadow)">TOGETHER FOREVER</text>
  
  <!-- Glassmorphism badge -->
  <rect x="300" y="730" width="200" height="40" rx="20" fill="#ffffff" opacity="0.25" />
  <text x="50%" y="750" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">PREMIUM TEMPLATE</text>
</svg>
